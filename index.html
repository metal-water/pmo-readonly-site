<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>PMO · 私有只读版本</title><link rel="stylesheet" href="./style.css"></head><body>
<main id="login"><section class="login-card"><div class="brand">PMO Suite</div><h1>私有只读版本</h1><p>登录后查看项目、代码和数据库快照。</p><form id="login-form"><label>账号<input id="username" autocomplete="username" value="metal-water" required></label><label>访问口令<input id="password" type="password" autocomplete="current-password" required></label><button id="login-button">登录并打开</button><p id="login-note" role="status"></p></form><small>这是独立访问口令，无需填写 GitHub 密码。</small></section></main>
<main id="workspace" hidden><header><strong>PMO · 只读快照</strong><span id="summary"></span><button id="logout">退出</button></header><nav><button data-tab="app" class="active">项目系统</button><button data-tab="source">完整代码</button><button data-tab="database">完整数据库</button><button data-tab="downloads">下载备份</button></nav>
<section id="app-panel"><iframe id="app-frame" title="PMO 项目系统只读快照"></iframe></section>
<section id="source-panel" hidden class="explorer"><aside><label>搜索文件<input id="file-search" placeholder="输入文件名或路径"></label><div id="file-list"></div></aside><article><h2 id="file-name">请选择文件</h2><pre id="file-content"></pre></article></section>
<section id="database-panel" hidden class="explorer"><aside><label>数据表<select id="table-select"></select></label><label>搜索当前表<input id="row-search" placeholder="搜索任意字段"></label><p id="table-count"></p></aside><article><div class="table-scroll"><table id="data-table"></table></div></article></section>
<section id="downloads-panel" hidden><h2>完整文件备份</h2><p id="download-note"></p><div id="download-list"></div><p>数据库为发布时的数据副本，包含全部原始表和上传文件；网站只读，后续修改需重新生成快照。</p><p>公司测试服数据库与本机数据库为独立来源；此版本以你本机的 PMO 数据为准。</p></section></main>
<script type="module" src="./client.js?v=2042dd48b2f1ccd3"></script></body></html>
